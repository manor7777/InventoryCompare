name: Release

on:
  push:
    tags: ["v*"]
    branches: ["ccr-1068abf9-t8ph01"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/inventory-compare.exe dist/InventoryCompare.exe
          Compress-Archive -Path dist/InventoryCompare.exe -DestinationPath dist/InventoryCompare-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: InventoryCompare-windows-x64
          path: dist/*
      - name: Publish GitHub release
        if: github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          # Tag pushes release as-is; branch pushes publish a numbered pre-release.
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v0.1.0-build.{0}', github.run_number) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/InventoryCompare.exe
            dist/InventoryCompare-windows-x64.zip
