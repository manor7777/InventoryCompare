name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/inventory-compare.exe dist/InventoryCompare.exe
          Compress-Archive -Path dist/InventoryCompare.exe -DestinationPath dist/InventoryCompare-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: InventoryCompare-windows-x64
          path: dist/*
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/InventoryCompare.exe
            dist/InventoryCompare-windows-x64.zip
